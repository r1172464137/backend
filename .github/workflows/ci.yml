name: CI

on:
  push:
    # Pushes to dev are covered by nightly.yml, which gates publishing on the
    # same checks; running them here too would double every dev push.
    branches: [master, main]
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  # Build, vet, database-backed tests, race detector, govulncheck, generated
  # code and lint; shared with nightly.yml and release.yml.
  checks:
    uses: ./.github/workflows/checks.yml

  # main is an independent stable line, not a descendant of origin/master.
  # Compare it to the actual previous main commit; dev/master retain the
  # upstream comparison to master. Never modify the remote branch.
  migration-lines:
    name: Check migration lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script tells one line from two by ancestry, which a shallow
          # clone cannot answer.
          fetch-depth: 0

      - name: Check migration lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" = main ]; then
            if [ "$EVENT_NAME" = pull_request ]; then
              LTS_REF="$BASE_SHA"
            else
              LTS_REF="$BEFORE_SHA"
            fi
            # Fail closed for a new branch, unavailable base or rewritten
            # history; the script itself otherwise skips an unavailable ref.
            [[ "$LTS_REF" =~ ^[0-9a-f]{40}$ && ! "$LTS_REF" =~ ^0+$ ]]
            git cat-file -e "$LTS_REF^{commit}" || git fetch --no-tags origin "$LTS_REF"
            git merge-base --is-ancestor "$LTS_REF" HEAD || {
              echo 'Previous main is not an ancestor of the checked-out commit' >&2
              exit 1
            }
          else
            git fetch --quiet origin master:refs/remotes/origin/master
            LTS_REF=refs/remotes/origin/master
            git cat-file -e "$LTS_REF^{commit}"
          fi
          export LTS_REF
          ./script/check-migration-lines.sh
