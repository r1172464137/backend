name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish/rebuild
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - id: meta
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          sha=$(git rev-parse HEAD)
          test "$(git rev-list -n 1 "$TAG")" = "$sha"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          channel=stable
          [[ $TAG != *-* ]] || channel=beta
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Focused contract and installer checks
        run: |
          bash script/test-release.sh
          go test -race -timeout 5m ./internal/module/network/entity/node ./internal/module/network/internal/adminserver ./internal/module/network/internal/serverapi ./internal/module/network/transport/http/server -run 'TestRealityXver|TestNormalizeProtocol|TestSanitizeProtocols|TestMergeMissingProtocol|TestCompatible' -count=1
      - name: Structured route-rule release gates
        run: |
          go test -race -timeout 5m -count=1 \
            ./internal/config \
            ./internal/app/bootstrap \
            ./internal/app/migration/schema \
            ./internal/module/network/internal/adminserver \
            ./internal/module/network/internal/nodeconfig \
            ./internal/module/network/internal/repo \
            ./internal/module/network/internal/serverapi \
            ./internal/module/network/transport/http/admin/server \
            ./internal/module/network/transport/http/server \
            ./internal/module/platform/internal/repo \
            ./internal/module/platform/internal/systemsetting \
            ./internal/module/platform/transport/http/admin/system \
            ./internal/transport/http/routes
          python3 script/check-release-workflow-contract.py

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: ['386', amd64, arm64]
        exclude:
          - goos: darwin
            goarch: '386'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: bash script/release-build.sh '${{ matrix.goos }}' '${{ matrix.goarch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/bin/*

  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release
      - name: Publish archives, installer and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          cp script/install.sh build/release/install.sh
          cd build/release
          sha256sum -- *.tar.gz *.zip install.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" ./*.tar.gz ./*.zip install.sh SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          prerelease=false
          [[ $CHANNEL != beta ]] || prerelease=true
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"

  ghcr:
    needs: [prepare, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: build/release
      - name: Assemble minimal image context
        run: |
          mkdir -p build/release/context/bin build/release/context/etc
          cp build/release/bin/ppanel-server-linux-{amd64,arm64} build/release/context/bin/
          chmod 755 build/release/context/bin/*
          touch build/release/context/etc/ppanel.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Export both image filesystems for inspection (no service execution)
        uses: docker/build-push-action@v6
        with:
          context: build/release/context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=build/release/rootfs
      - name: Verify exact release binaries and CA certificates in each image
        run: bash script/verify-release-rootfs.sh build/release/rootfs build/release/context/bin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ppanel-server
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Push verified multiarch image
        uses: docker/build-push-action@v6
        with:
          context: build/release/context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
